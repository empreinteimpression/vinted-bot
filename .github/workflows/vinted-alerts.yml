```yaml
name: Vinted alerts

'on':
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: vinted-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Verifier la syntaxe Python
        run: python -m py_compile bot.py

      - name: Verifier les secrets Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ]; then
            echo "::error::Le secret TELEGRAM_TOKEN est manquant."
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Le secret TELEGRAM_CHAT_ID est manquant."
            exit 1
          fi
          echo "Les deux secrets Telegram sont configures."

      - name: Lancer le bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Sauvegarder seen.json
        if: always()
        run: |
          if [ -f seen.json ]; then
            git config user.name "vinted-bot"
            git config user.email "vinted-bot@users.noreply.github.com"
            git add seen.json
            if ! git diff --staged --quiet; then
              git commit
