
name: Vinted alerts

on:
  schedule:
   - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vinted-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Vérifier la syntaxe Python
        run: python -m py_compile bot.py

      - name: Vérifier les secrets Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ]; then
            echo "::error::Le secret TELEGRAM_TOKEN est manquant."
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Le secret TELEGRAM_CHAT_ID est manquant."
            exit 1
          fi
          echo "Les deux secrets Telegram sont configurés."

      - name: Lancer le bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Sauvegarder seen.json
        if: always()
        run: |
          if [ -f seen.json ]; then
            git config user.name "vinted-bot"
            git config user.email "vinted-bot@users.noreply.github.com"
            git add seen.json
            if ! git diff --staged --quiet; then
              git commit -m "update seen"
              git push
            else
              echo "Aucun changement dans seen.json."
            fi
          else
            echo "seen.json absent ; aucune sauvegarde à effectuer."
          fi
